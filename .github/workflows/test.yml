name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: go.mod
      - name: Build toolchain dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build
        run: go build -o "$RUNNER_TEMP/xqnet" ./cmd/xqnet
      - name: Release surface
        run: |
          "$RUNNER_TEMP/xqnet" --version | grep -q '^xqnet 0.1.3-rc5$'
          "$RUNNER_TEMP/xqnet" --version | grep -q '^eventizer network-reference-v1.4$'
          "$RUNNER_TEMP/xqnet" --version | grep -q '^analysis xqnet-analysis-v0.2$'
          "$RUNNER_TEMP/xqnet" --version | grep -q '^mcp xqnet-mcp-v0.1$'
          "$RUNNER_TEMP/xqnet" eventize --help >/dev/null
          "$RUNNER_TEMP/xqnet" inspect --help >/dev/null
          "$RUNNER_TEMP/xqnet" validate --help >/dev/null
          "$RUNNER_TEMP/xqnet" mcp --help >/dev/null
          test -s LICENSE
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES.md
      - name: Zeek end-to-end
        run: |
          "$RUNNER_TEMP/xqnet" eventize ./testdata/zeek --adapter zeek --source sample --network-id network:test --network-cidrs 192.168.1.0/24 --out "$RUNNER_TEMP/xqnet-zeek"
          "$RUNNER_TEMP/xqnet" validate "$RUNNER_TEMP/xqnet-zeek/canonical/events.jsonl"
          "$RUNNER_TEMP/xqnet" inspect --diagnostics "$RUNNER_TEMP/xqnet-zeek"
          grep -q '"analysis_contract": "xqnet-analysis-v0.2"' "$RUNNER_TEMP/xqnet-zeek/manifest.json"
          grep -q '"row_group_max_rows": 131072' "$RUNNER_TEMP/xqnet-zeek/manifest.json"
          test -s "$RUNNER_TEMP/xqnet-zeek/analysis/entities.parquet"
          test -s "$RUNNER_TEMP/xqnet-zeek/analysis/events.parquet"
          test -s "$RUNNER_TEMP/xqnet-zeek/analysis/observations.parquet"
      - name: Suricata end-to-end
        run: |
          "$RUNNER_TEMP/xqnet" eventize ./testdata/suricata/eve.json --adapter suricata --source sample --network-id network:test --network-cidrs 192.168.1.0/24 --out "$RUNNER_TEMP/xqnet-suricata"
          "$RUNNER_TEMP/xqnet" validate "$RUNNER_TEMP/xqnet-suricata/canonical/events.jsonl"
          grep -q '"analysis_contract": "xqnet-analysis-v0.2"' "$RUNNER_TEMP/xqnet-suricata/manifest.json"
      - name: MCP integration
        env:
          XQNET_TEST_DATASET: ${{ runner.temp }}/xqnet-zeek
        run: |
          go test -tags mcpintegration ./internal/mcpserver -v
          "$RUNNER_TEMP/xqnet" mcp "$RUNNER_TEMP/xqnet-zeek" </dev/null >"$RUNNER_TEMP/mcp.stdout" 2>"$RUNNER_TEMP/mcp.stderr" || true
          test ! -s "$RUNNER_TEMP/mcp.stdout"
